name: OpenGrep SAST
on: [push, workflow_dispatch]
jobs:
  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGrep
        run: curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
      - name: Run OpenGrep
        run: |
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          opengrep --config=r/all --exclude-rule=bbp-pattern-inject --json --verbose . > opengrep-results.json
      - name: Show results
        run: cat opengrep-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: opengrep-results
          path: opengrep-results.json

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="'Space Grotesk',system-ui,sans-serif">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bf6"/><stop offset="1" stop-color="#4cc4f0"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#5f6d94"/>
    </marker>
    <style>
      .lbl{fill:#e8ecfb;font-size:14px;font-weight:600}
      .sub{fill:#8a97bd;font-size:11px}
      .tag{fill:#5f6d94;font-size:10.5px;letter-spacing:.06em}
      .box{fill:#151d31;stroke:#28345a;rx:12}
      .flow{stroke:#5f6d94;stroke-width:1.6;fill:none}
      .flow-d{stroke:#354268;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .mono{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:#aeb9e0}
    </style>
  </defs>

  <rect width="940" height="660" fill="#0e1524"/>
  <rect x="20" y="18" width="34" height="34" rx="9" fill="url(#logo)"/>
  <text x="46" y="41" font-size="20" fill="#0a0f1c" font-weight="700" text-anchor="middle">◇</text>
  <text x="66" y="34" fill="#e8ecfb" font-size="19" font-weight="600">Reliably — architecture</text>
  <text x="66" y="50" class="sub">Builder UI · resumable engine · pluggable providers · puzzle definitions</text>

  <!-- UI LAYER -->
  <text x="20" y="86" class="tag">UI LAYER  (src/ui, src/App.jsx)</text>
  <rect class="box" x="20" y="94" width="900" height="86" rx="12"/>
  <g>
    <rect class="box" x="36" y="110" width="200" height="54" fill="#1b2640"/>
    <text x="50" y="132" class="lbl">Builder canvas</text><text x="50" y="150" class="sub">place · order · configure blocks</text>
    <rect class="box" x="252" y="110" width="200" height="54" fill="#1b2640"/>
    <text x="266" y="132" class="lbl">Execution trace</text><text x="266" y="150" class="sub">per-step status + payloads</text>
    <rect class="box" x="468" y="110" width="212" height="54" fill="#1b2640"/>
    <text x="482" y="132" class="lbl">Review / Interrupt</text><text x="482" y="150" class="sub">approve · edit · reject · resume</text>
    <rect class="box" x="696" y="110" width="208" height="54" fill="#1b2640"/>
    <text x="710" y="132" class="lbl">Reliability report</text><text x="710" y="150" class="sub">graded checks + stats</text>
  </g>

  <!-- arrows UI <-> engine -->
  <path class="flow" d="M470 180 L470 208" marker-end="url(#ar)"/>
  <path class="flow" d="M500 250 L500 182" marker-end="url(#ar)"/>
  <text x="512" y="200" class="mono">stepOnce()</text>
  <text x="360" y="200" class="mono" text-anchor="end">state ▸</text>

  <!-- ENGINE -->
  <text x="20" y="236" class="tag">ENGINE  (src/engine) — resumable async state machine, one block per step</text>
  <rect class="box" x="20" y="244" width="620" height="220" rx="12" stroke="#8b7bf6" stroke-opacity="0.5"/>
  <text x="38" y="270" class="lbl" fill="#b39bff">createRun → stepOnce → (resume | decide)</text>

  <g>
    <rect class="box" x="38" y="284" width="180" height="46" fill="#12193b"/>
    <text x="52" y="304" class="lbl">Rolling checkpoint</text><text x="52" y="320" class="sub">last successful step</text>
    <rect class="box" x="230" y="284" width="180" height="46" fill="#12193b"/>
    <text x="244" y="304" class="lbl">Retry / Fallback</text><text x="244" y="320" class="sub">recover thrown failures</text>
    <rect class="box" x="422" y="284" width="200" height="46" fill="#12193b"/>
    <text x="436" y="304" class="lbl">Validator / Condition</text><text x="436" y="320" class="sub">structured-output guards</text>

    <rect class="box" x="38" y="342" width="180" height="46" fill="#12193b"/>
    <text x="52" y="362" class="lbl">Human pause</text><text x="52" y="378" class="sub">decisions map by block id</text>
    <rect class="box" x="230" y="342" width="180" height="46" fill="#12193b"/>
    <text x="244" y="362" class="lbl" fill="#ffb066">Interrupt → resume</text><text x="244" y="378" class="sub">from checkpoint, not restart</text>
    <rect class="box" x="422" y="342" width="200" height="46" fill="#12193b"/>
    <text x="436" y="362" class="lbl">buildReport</text><text x="436" y="378" class="sub">recovery + reliability signals</text>
  </g>

  <!-- failure injection note -->
  <rect class="box" x="38" y="402" width="584" height="46" fill="#1c1220" stroke="#f66d93" stroke-opacity="0.4"/>
  <text x="52" y="422" class="lbl" fill="#f66d93">Failure injection lives here — not in providers</text>
  <text x="52" y="438" class="sub">timeout · malformed · low-confidence · empty retrieval · interruption — identical for mock &amp; live</text>

  <!-- PUZZLES feeding engine -->
  <text x="664" y="236" class="tag">PUZZLES  (src/puzzles)</text>
  <rect class="box" x="664" y="244" width="256" height="220" rx="12" stroke="#3ddc97" stroke-opacity="0.4"/>
  <text x="680" y="270" class="lbl" fill="#3ddc97">8 puzzle definitions</text>
  <text x="680" y="292" class="mono">initial() blocks</text>
  <text x="680" y="312" class="mono">failure.plan(block, ctx)</text>
  <text x="680" y="332" class="mono">checkValid(payload)</text>
  <text x="680" y="352" class="mono">grade(report) ▸ checks[]</text>
  <text x="680" y="384" class="sub">beginner → advanced:</text>
  <text x="680" y="402" class="sub">summarize · approve · route ·</text>
  <text x="680" y="420" class="sub">extract · timeout · ground ·</text>
  <text x="680" y="438" class="sub">fallback · resume (checkpoint)</text>
  <path class="flow-d" d="M664 354 L624 354" marker-end="url(#ar)"/>

  <!-- PROVIDERS -->
  <text x="20" y="500" class="tag">PROVIDER INTERFACE  (src/providers) — run(op, args) → { value, note }</text>
  <rect class="box" x="20" y="508" width="900" height="120" rx="12" stroke="#4cc4f0" stroke-opacity="0.45"/>
  <path class="flow" d="M330 464 L330 508" marker-end="url(#ar)"/>
  <text x="342" y="492" class="mono">content only ▾</text>

  <rect class="box" x="40" y="528" width="270" height="82" fill="#12193b"/>
  <text x="56" y="552" class="lbl">index.js · getProvider(cfg)</text>
  <text x="56" y="572" class="sub">selects provider from UI config;</text>
  <text x="56" y="590" class="sub">defaults to mock (zero setup)</text>

  <rect class="box" x="326" y="528" width="270" height="82" fill="#0f1a1a" stroke="#3ddc97" stroke-opacity="0.4"/>
  <text x="342" y="552" class="lbl" fill="#3ddc97">mockProvider + tool simulator</text>
  <text x="342" y="572" class="sub">model fixtures + simulated tool layer</text>
  <text x="342" y="590" class="sub">(research / retrieval) — offline</text>

  <rect class="box" x="612" y="528" width="288" height="82" fill="#151033" stroke="#8b7bf6" stroke-opacity="0.5"/>
  <text x="628" y="552" class="lbl" fill="#b39bff">anthropicProvider (optional)</text>
  <text x="628" y="572" class="sub">live Claude via Messages API;</text>
  <text x="628" y="590" class="sub">strict-JSON prompts per op</text>

  <text x="20" y="648" class="sub">Same interface both ways → swapping the provider changes where the words come from, never how the workflow executes, validates, fails, or recovers.</text>
</svg>

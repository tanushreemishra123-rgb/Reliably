<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'Space Grotesk',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bf6"/><stop offset="1" stop-color="#4cc4f0"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#7d8ab5"/>
    </marker>
    <style>
      .lbl{fill:#e8ecfb;font-size:14px;font-weight:600}
      .sub{fill:#8a97bd;font-size:11px}
      .tag{fill:#7d8ab5;font-size:11px;letter-spacing:.06em}
      .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#aeb9e0}
      .flowlbl{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#8a97bd}
    </style>
  </defs>

  <rect width="960" height="780" fill="#0e1524"/>

  <!-- Header -->
  <rect x="24" y="22" width="36" height="36" rx="9" fill="url(#logo)"/>
  <text x="42" y="46" font-size="21" fill="#0a0f1c" font-weight="700" text-anchor="middle">◇</text>
  <text x="72" y="40" fill="#e8ecfb" font-size="20" font-weight="600">Reliably — architecture</text>
  <text x="72" y="58" class="sub">Builder UI · resumable state-machine engine · pluggable providers · puzzle definitions</text>

  <!-- ===================== UI LAYER ===================== -->
  <text x="24" y="94" class="tag">UI LAYER — src/ui, src/App.jsx</text>
  <rect x="24" y="102" width="912" height="96" rx="12" fill="#151d31" stroke="#28345a"/>
  <g>
    <rect x="42" y="120" width="210" height="60" rx="9" fill="#1b2640"/>
    <text x="58" y="145" class="lbl">Builder canvas</text><text x="58" y="164" class="sub">place · order · configure</text>
    <rect x="266" y="120" width="210" height="60" rx="9" fill="#1b2640"/>
    <text x="282" y="145" class="lbl">Execution trace</text><text x="282" y="164" class="sub">per-step status + payload</text>
    <rect x="490" y="120" width="210" height="60" rx="9" fill="#1b2640"/>
    <text x="506" y="145" class="lbl">Review / Interrupt</text><text x="506" y="164" class="sub">approve · reject · resume</text>
    <rect x="714" y="120" width="204" height="60" rx="9" fill="#1b2640"/>
    <text x="730" y="145" class="lbl">Reliability report</text><text x="730" y="164" class="sub">graded checks + stats</text>
  </g>

  <!-- gutter: UI <-> ENGINE (two separate arrows, labels below each) -->
  <line x1="300" y1="212" x2="300" y2="252" stroke="#7d8ab5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="300" y="268" class="flowlbl" text-anchor="middle">stepOnce · resume · decide ▾</text>
  <line x1="660" y1="252" x2="660" y2="212" stroke="#7d8ab5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="660" y="268" class="flowlbl" text-anchor="middle">▴ state</text>

  <!-- ===================== ENGINE ===================== -->
  <text x="24" y="284" class="tag">ENGINE — src/engine · resumable async state machine (one block per step)</text>
  <rect x="24" y="292" width="612" height="196" rx="12" fill="#151d31" stroke="#8b7bf6" stroke-opacity="0.5"/>
  <text x="42" y="318" class="lbl" fill="#b39bff">createRun → stepOnce → (resume | decide)</text>

  <rect x="42" y="332" width="184" height="44" rx="8" fill="#12193b"/>
  <text x="56" y="352" class="lbl" font-size="12.5">Rolling checkpoint</text><text x="56" y="368" class="sub">last successful step</text>
  <rect x="234" y="332" width="184" height="44" rx="8" fill="#12193b"/>
  <text x="248" y="352" class="lbl" font-size="12.5">Retry / Fallback</text><text x="248" y="368" class="sub">recover thrown errors</text>
  <rect x="426" y="332" width="192" height="44" rx="8" fill="#12193b"/>
  <text x="440" y="352" class="lbl" font-size="12.5">Validator / Condition</text><text x="440" y="368" class="sub">structured-output guards</text>

  <rect x="42" y="384" width="184" height="44" rx="8" fill="#12193b"/>
  <text x="56" y="404" class="lbl" font-size="12.5">Human pause</text><text x="56" y="420" class="sub">decisions by block id</text>
  <rect x="234" y="384" width="184" height="44" rx="8" fill="#12193b"/>
  <text x="248" y="404" class="lbl" font-size="12.5" fill="#ffb066">Interrupt → resume</text><text x="248" y="420" class="sub">from checkpoint</text>
  <rect x="426" y="384" width="192" height="44" rx="8" fill="#12193b"/>
  <text x="440" y="404" class="lbl" font-size="12.5">buildReport</text><text x="440" y="420" class="sub">reliability signals</text>

  <rect x="42" y="436" width="576" height="38" rx="8" fill="#1c1220" stroke="#f66d93" stroke-opacity="0.4"/>
  <text x="56" y="460" class="sub" fill="#f66d93">Failure injection lives here — identical for mock &amp; live (timeout · malformed · low-confidence · empty · interrupt)</text>

  <!-- PUZZLES (side) -->
  <text x="660" y="284" class="tag">PUZZLES — src/puzzles</text>
  <rect x="660" y="292" width="276" height="196" rx="12" fill="#151d31" stroke="#3ddc97" stroke-opacity="0.4"/>
  <text x="678" y="318" class="lbl" fill="#3ddc97">8 puzzle definitions</text>
  <text x="678" y="344" class="mono">initial() blocks</text>
  <text x="678" y="366" class="mono">failure.plan(block, ctx)</text>
  <text x="678" y="388" class="mono">checkValid(payload)</text>
  <text x="678" y="410" class="mono">grade(report) → checks[]</text>
  <text x="678" y="444" class="sub">beginner → advanced</text>
  <text x="678" y="462" class="sub">seed input · schema · mock data</text>
  <line x1="660" y1="400" x2="620" y2="400" stroke="#354268" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/>

  <!-- gutter: ENGINE <-> PROVIDERS -->
  <line x1="300" y1="500" x2="300" y2="540" stroke="#7d8ab5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="300" y="556" class="flowlbl" text-anchor="middle">run(op, args) ▾</text>
  <line x1="660" y1="540" x2="660" y2="500" stroke="#7d8ab5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="660" y="556" class="flowlbl" text-anchor="middle">▴ { value, note }</text>

  <!-- ===================== PROVIDERS ===================== -->
  <text x="24" y="582" class="tag">PROVIDER INTERFACE — src/providers · one contract, layered implementations</text>
  <rect x="24" y="590" width="912" height="128" rx="12" fill="#151d31" stroke="#4cc4f0" stroke-opacity="0.45"/>
  <text x="42" y="616" class="lbl" fill="#7fd4f2">getProvider(cfg) — selects the active provider (mock by default)</text>

  <rect x="42" y="632" width="272" height="68" rx="9" fill="#12193b"/>
  <text x="58" y="658" class="lbl" font-size="13">index.js · registry</text>
  <text x="58" y="678" class="sub">picks mock vs live from config</text>

  <rect x="330" y="632" width="272" height="68" rx="9" fill="#0f1a1a" stroke="#3ddc97" stroke-opacity="0.4"/>
  <text x="346" y="658" class="lbl" font-size="13" fill="#3ddc97">mockProvider + tool simulator</text>
  <text x="346" y="678" class="sub">deterministic, offline, no network</text>

  <rect x="618" y="632" width="300" height="68" rx="9" fill="#151033" stroke="#8b7bf6" stroke-opacity="0.5"/>
  <text x="634" y="658" class="lbl" font-size="13" fill="#b39bff">anthropicProvider (optional)</text>
  <text x="634" y="678" class="sub">live Claude · same interface</text>

  <text x="24" y="748" class="sub">Same interface both ways → swapping the provider changes where the words come from, never how the workflow executes, validates, fails, or recovers.</text>
</svg>
